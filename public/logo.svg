<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- back card: white, tilted right, black diamond pip in its corner -->
  <g transform="rotate(10 88 56)">
    <rect x="58" y="12" width="58" height="86" rx="10" fill="#fff" stroke="#000" stroke-width="5" />
    <path d="M 101 24 l 6 8 l -6 8 l -6 -8 Z" fill="#000" />
  </g>
  <!-- front card: black, tilted left; thin white outline keeps the gap -->
  <g transform="rotate(-8 44 74)">
    <rect x="14" y="28" width="60" height="88" rx="10" fill="#000" stroke="#fff" stroke-width="4" />
    <!-- corner pip -->
    <path d="M 63 36 l 5.5 7 l -5.5 7 l -5.5 -7 Z" fill="#fff" />
    <!-- the big center diamond -->
    <path d="M 40 52 L 54 74 L 40 96 L 26 74 Z" fill="#fff" />
    <!-- up-right arrow, riding the card's lower-right quarter -->
    <g transform="translate(49 97) rotate(-45)">
      <rect x="0" y="-3.5" width="14" height="7" fill="#fff" />
      <path d="M 14 -8 L 25 0 L 14 8 Z" fill="#fff" />
    </g>
  </g>
</svg>
